name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Fix output structure for GitHub Pages
        run: |
          # Se Nitro ha creato una sottocartella con il nome del base path, spostiamo i file in .output/public
          if [ -d ".output/public/ebook-luxe-reader" ]; then
            cp -r .output/public/ebook-luxe-reader/* .output/public/
            rm -rf .output/public/ebook-luxe-reader
          fi
          # Assicuriamoci che esista un index.html, altrimenti lo creiamo di fallback
          if [ ! -f ".output/public/index.html" ]; then
            echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Ebook Luxe Reader</title></head><body><script>window.location.href = '/ebook-luxe-reader/';</script></body></html>" > .output/public/index.html
          fi
          cp .output/public/index.html .output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
