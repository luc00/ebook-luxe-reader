name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun / Node
        uses: oven-sh/setup-bun@v1 # Visto che usi bun.lock nel progetto

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # (o la cartella di output del tuo build)
